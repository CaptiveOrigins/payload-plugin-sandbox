# Release: pushing a version tag (vX.Y.Z) builds, tests and *stages* the package on npm.
# Nothing goes public until the captiveorigins npm account approves it with 2FA
# (npmjs.com → your avatar → Staged Packages → Approve, or `npm stage approve <id>`).
# No token is stored: npm trusted publishing (OIDC) lets only this workflow stage.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.15.0
      # Integration tests run a real Payload on a throwaway database. MongoDB 7.0: 8.x can't start on the
      # runners' Linux 6.19+ kernels (SERVER-125742).
      - name: Disposable MongoDB replica set
        run: |
          docker run -d --name mongo -p 127.0.0.1:27018:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          ok=
          for i in $(seq 1 60); do
            if docker exec mongo mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }" >/dev/null 2>&1 \
              && [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null)" = "true" ]; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then docker logs mongo 2>&1 | tail -50; exit 1; fi
      - run: npm ci
      - name: GitHub description matches package.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${{ github.repository }} -q .description)" = "$(node -p "require('./package.json').description")" \
            || { echo "::error::GitHub's description differs from package.json: sync it (npm run packages:sync in captive-origins) and re-tag."; exit 1; }
      - name: Tag matches package.json
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      # prepublishOnly (typecheck, tests) and prepack (build) run as for npm publish.
      - name: Stage on npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in *-*) TAG=next ;; *) TAG=latest ;; esac
          npm stage publish --access public --provenance --tag "$TAG"
